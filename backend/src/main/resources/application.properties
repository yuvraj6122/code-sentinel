spring.application.name=CodeSentinel

spring.datasource.url=jdbc:postgresql://localhost:5432/codesentinel
spring.datasource.username=codesentinel_user
spring.datasource.password=codesentinel

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

codesentinel.clone.base-path=/tmp/codesentinel

# Complexity Analysis Agent thresholds (all tunable here, never hard-coded).
# Each metric is graded: value >= high -> HIGH, >= medium -> MEDIUM, >= low -> LOW,
# below low -> not reported (OK).

# Cyclomatic complexity (PMD): 11-15 LOW, 16-20 MEDIUM, >20 HIGH.
codesentinel.complexity.cyclomatic.low-threshold=11
codesentinel.complexity.cyclomatic.medium-threshold=16
codesentinel.complexity.cyclomatic.high-threshold=21
# Effectively disables class-level cyclomatic reporting (lower to enable).
codesentinel.complexity.cyclomatic-class-report-level=9999

# Method length, counted as non-empty lines: 50-99 LOW, 100-149 MEDIUM, >=150 HIGH.
codesentinel.complexity.method-length.low-threshold=50
codesentinel.complexity.method-length.medium-threshold=100
codesentinel.complexity.method-length.high-threshold=150

# Class length, counted as non-empty lines: 300-499 LOW, 500-799 MEDIUM, >=800 HIGH.
codesentinel.complexity.class-length.low-threshold=300
codesentinel.complexity.class-length.medium-threshold=500
codesentinel.complexity.class-length.high-threshold=800

codesentinel.duplication.minimum-tokens=50
codesentinel.duplication.lines.low-threshold=20
codesentinel.duplication.lines.medium-threshold=50
codesentinel.duplication.lines.high-threshold=100

# Testing Analysis Agent — evaluates test-suite quality and maturity (not counts).
# Disabled/ignored test count → severity: 1-5 LOW, 6-10 MEDIUM, 11+ HIGH.
codesentinel.testing.disabled-tests.low-threshold=1
codesentinel.testing.disabled-tests.medium-threshold=6
codesentinel.testing.disabled-tests.high-threshold=11

# Maturity score (0-100) penalties, deducted from a perfect 100.
codesentinel.testing.maturity.no-framework-penalty=40
codesentinel.testing.maturity.no-mocking-penalty=8
codesentinel.testing.maturity.no-integration-penalty=15
codesentinel.testing.maturity.disabled-test-penalty-per-test=3
codesentinel.testing.maturity.disabled-test-penalty-cap=20
codesentinel.testing.maturity.no-assertion-penalty-per-test=4
codesentinel.testing.maturity.no-assertion-penalty-cap=20
codesentinel.testing.maturity.empty-class-penalty-per-class=3
codesentinel.testing.maturity.empty-class-penalty-cap=12
codesentinel.testing.maturity.poor-naming-penalty-per-method=1
codesentinel.testing.maturity.poor-naming-penalty-cap=10
codesentinel.testing.maturity.poor-organization-penalty=8